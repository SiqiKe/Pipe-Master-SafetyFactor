# contents of pyproject.toml

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pnetwork"
version = "0.1.0"
description = "Stormwater pipe network design under uncertainty"
authors = [{name = "Siqi Ke", email = "siqi.ke.th@dartmouth.edu"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pymoo>=0.6.0",
    "pyswmm>=2.0.0",
    "numpy>=1.20.0",
    "pandas>=1.0.0",
    "pyreadr>=0.5.0",
    "joblib>=1.0.0",
    "tqdm>=4.50.0",
    "SALib>=1.4.0",
    "brokenaxes>=0.6.0",
    "scipy>=1.5.0",
    "matplotlib>=3.0.0",
    "seaborn>=0.11.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "ipython>=7.0.0"
]
